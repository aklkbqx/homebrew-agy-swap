name: Sync latest formula

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download formula from latest release
        run: curl -fsSL https://github.com/aklkbqx/agy-swap/releases/latest/download/agy-swap.rb -o Formula/agy-swap.rb
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/agy-swap.rb
          git commit -m "build: sync latest agy-swap formula"
          git push
